<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <title>TSTC Sidebar</title>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="topline">
          <div class="notif-row">
            <div class="indicator" id="tabChat">
              <span class="dot"></span>
              <span class="label">Chat</span>
            </div>
            <div class="indicator" id="tabEmail">
              <span class="dot"></span>
              <span class="label">Email</span>
            </div>
          </div>
        </div>

        <div class="drive-row">
          <input id="driveQuery" class="input" placeholder="Search Google Drive" />
          <button id="driveSearchBtn" class="btn">Search</button>
        </div>

        <div class="auth-row">
          <button id="connectGoogleBtn" class="btn btn-secondary">Connect Google</button>
          <button id="logoutBtn" class="btn btn-secondary warn">Logout</button>
        </div>

        <div id="status" class="muted" style="margin-top: 8px;"></div>
      </div>

      <div class="main">
        <!-- Organization Quick Links Section -->
        <div class="card">
          <div class="card-head">
            <span class="card-title" id="orgTitle">Organization Quick Links</span>
            <div class="item-actions">
              <button id="addOrgLinkBtn" class="icon-btn hidden">Add Link</button>
              <button id="createOrgBtn" class="icon-btn">Create</button>
              <button id="joinOrgBtn" class="icon-btn">Join</button>
              <button id="leaveOrgBtn" class="icon-btn warn hidden">Leave</button>
            </div>
          </div>
          <div id="groupLinks" class="list"></div>
        </div>

        <!-- My Links Section -->
        <div class="card">
          <div class="card-head">
            <span class="card-title">My Links</span>
            <button id="addMyLinkBtn" class="icon-btn">Add</button>
          </div>
          <div id="myLinks" class="list"></div>
        </div>

        <!-- Calendar Section -->
        <div class="card">
          <div class="card-head">
            <span class="card-title">Calendar</span>
          </div>
          <div id="calendar" class="list"></div>
        </div>
      </div>
    </div>

    <!-- MUST load config and supabase before sidepanel.js -->
    <script src="config.js"></script>
    <script src="vendor/supabase.min.js"></script>
    <script src="supabaseClient.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
